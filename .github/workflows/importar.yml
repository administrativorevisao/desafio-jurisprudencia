name: Importar pacote do desafio
on:
  push:
    paths: ['desafio-jurisprudencia_*.zip', '.github/workflows/importar.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: importar-pacote
  cancel-in-progress: false
jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Extrair os zips e publicar os arquivos
        run: |
          shopt -s nullglob
          zips=(desafio-jurisprudencia_*.zip)
          [ ${#zips[@]} -eq 0 ] && exit 0
          for z in "${zips[@]}"; do unzip -oq "$z" -d /tmp/pkg; done
          cp -a /tmp/pkg/desafio-jurisprudencia/. .
          git rm -q desafio-jurisprudencia_*.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Importa parte do pacote do Desafio de Jurisprudencia"
          git push
